<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── 工具栏 ── */
#toolbar {
  background: #16213e; border-bottom: 1px solid #e9456640; padding: 8px 14px;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4); flex-wrap: wrap;
}
.sep { width: 1px; height: 26px; background: #e9456640; margin: 0 2px; flex-shrink: 0; }
.btn {
  background: #0f3460; color: #d0d0d0; border: 1px solid #e9456650; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; white-space: nowrap; line-height: 1.3;
}
.btn:hover:not(:disabled) { background: #e94566; border-color: #e94566; color: #fff; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.accent { background: #e94566; border-color: #e94566; color: #fff; }
.btn.accent:hover { background: #c73050; }
.label { color: #888; font-size: 12px; white-space: nowrap; }
#size-input { width: 54px; padding: 5px 6px; background: #0a1628; border: 1px solid #e9456660; color: #d0d0d0; border-radius: 6px; font-size: 13px; text-align: center; }
#status { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
#file-name { color: #b0b0b0; font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#unsaved { color: #f39c12; font-size: 11px; display: none; }
#unsaved.show { display: block; }

/* ── 标签栏 ── */
#tab-bar {
  display: none; background: #0f1a30; border-bottom: 1px solid #e9456640;
  padding: 4px 8px 0; flex-shrink: 0; align-items: flex-end; gap: 0; min-height: 32px;
  position: relative;
}
#tab-bar.show { display: flex; }
#tab-container { display: flex; gap: 2px; flex: 1; overflow-x: auto; align-items: flex-end; padding-right: 2px; }
#tab-container::-webkit-scrollbar { height: 3px; }
#tab-container::-webkit-scrollbar-thumb { background: #e9456660; border-radius: 2px; }
.tab {
  display: flex; align-items: center; gap: 6px; background: #0a1628; border: 1px solid #e9456630;
  border-bottom: none; border-radius: 6px 6px 0 0; padding: 5px 10px; cursor: pointer;
  font-size: 12px; color: #888; white-space: nowrap; max-width: 180px; flex-shrink: 0;
  transition: all 0.12s; user-select: none;
}
.tab:hover { color: #ccc; border-color: #e9456650; }
.tab.active { background: #16213e; color: #e0e0e0; border-color: #e94566; }
.tab .tab-name { overflow: hidden; text-overflow: ellipsis; }
.tab .tab-dot { display: none; width: 6px; height: 6px; border-radius: 50%; background: #f39c12; flex-shrink: 0; }
.tab .tab-dot.show { display: inline-block; }
.tab .tab-close { font-size: 14px; line-height: 1; color: #666; padding: 0 2px; border-radius: 3px; flex-shrink: 0; }
.tab .tab-close:hover { color: #e94566; background: #e9456620; }
#btn-new-tab { background: #0f1a30; color: #888; border: 1px dashed #e9456640; border-radius: 6px; padding: 3px 10px; font-size: 16px; cursor: pointer; line-height: 1.3; margin-bottom: 2px; flex-shrink: 0; position: sticky; right: 0; box-shadow: -4px 0 6px #0f1a30; z-index: 2; }
#btn-new-tab:hover { color: #e94566; border-color: #e94566; }

/* ── 预览区 ── */
#preview-wrap { flex: 1; overflow: auto; position: relative; background: #fff; }
#empty-state {
  height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; background: #1a1a2e; color: #aaa;
}
#empty-state .ico { font-size: 72px; }
#empty-state h2 { color: #ddd; font-size: 20px; font-weight: 500; }
#empty-state p { font-size: 13px; color: #777; }
#preview { display: none; min-height: 100%; background: #fff; position: relative; cursor: default; }
#preview *.ed-active { outline: 2px solid #0078d4 !important; outline-offset: 1px; }
#preview *:not(#preview):hover { outline: 1px dashed #0078d460; }
#preview img:hover { outline: 2px dashed #e94566 !important; cursor: pointer; }

/* ── 浮动工具条 ── */
#fbar {
  position: fixed; display: none; background: #16213e; border: 1px solid #e94566;
  border-radius: 8px; padding: 7px 8px; gap: 5px; z-index: 99999;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5); align-items: center; max-width: 500px; flex-wrap: wrap;
}
#fbar.show { display: flex; }
.fb { background: #0f3460; color: #d0d0d0; border: 1px solid #e9456650; padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; white-space: nowrap; line-height: 1.3; }
.fb:hover { background: #e94566; color: #fff; }
.fb.warn { color: #f39c12; }
.fb.warn:hover { background: #c0392b; color: #fff; }
.fb-sep { width: 1px; height: 20px; background: #e9456640; }
#fb-sz { width: 46px; padding: 3px 5px; background: #0a1628; border: 1px solid #e9456660; color: #d0d0d0; border-radius: 5px; font-size: 12px; text-align: center; }

/* ── 拖放遮罩 ── */
#drop-mask { display: none; position: fixed; inset: 0; background: rgba(233,69,102,0.12); border: 3px dashed #e94566; z-index: 99998; align-items: center; justify-content: center; font-size: 26px; color: #e94566; font-weight: 600; pointer-events: none; }
#drop-mask.show { display: flex; }

/* ── Toast ── */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #16213e; border: 1px solid #e94566; color: #e0e0e0; padding: 10px 22px; border-radius: 8px; font-size: 14px; z-index: 999999; pointer-events: none; animation: toastIn 0.2s ease; }
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(8px); } }
</style>
</head>
<body>

<!-- 工具栏 -->
<div id="toolbar">
  <button class="btn accent" id="btn-open">📂 打开文件</button>
  <button class="btn" id="btn-save" disabled>💾 保存</button>
  <div id="status"><span id="file-name">未打开文件</span><span id="unsaved">● 有未保存更改</span></div>
</div>

<!-- 标签栏 -->
<div id="tab-bar"><div id="tab-container"></div><button id="btn-new-tab">+</button></div>

<!-- 预览区 -->
<div id="preview-wrap">
  <div id="empty-state">
    <div class="ico">📄</div>
    <h2>本地 HTML 编辑器</h2>
    <p>在预览中直接编辑文字、字号、图片、新增行</p>
    <button class="btn accent" onclick="openFile()" style="padding:10px 28px;font-size:15px;margin-top:6px">📂 打开文件</button>
    <p style="margin-top:12px;font-size:12px;color:#555">或将 .html 文件拖到此处</p>
  </div>
  <div id="preview"></div>
</div>

<!-- 浮动工具条 -->
<div id="fbar">
  <button class="fb" id="fb-aplus">A+</button>
  <input type="number" id="fb-sz" value="16" min="6" max="200">
  <button class="fb" id="fb-aminus">A−</button>
  <button class="fb" id="fb-apply">✓ 应用字号</button>
  <div class="fb-sep"></div>
  <button class="fb" id="fb-add-text">➕ 文字行</button>
  <button class="fb" id="fb-add-img">🖼 图片行</button>
  <button class="fb" id="fb-repl-img" style="display:none">🔄 替换图片</button>
  <div class="fb-sep"></div>
  <button class="fb warn" id="fb-del">🗑 删除</button>
</div>

<!-- 拖放遮罩 -->
<div id="drop-mask">放开鼠标以打开 HTML 文件</div>

<!-- 隐藏文件输入 -->
<input type="file" id="file-in" accept=".html,.htm" style="display:none">
<input type="file" id="img-in" accept="image/*" style="display:none">

<script>
// ── Tab 状态管理 ──
let nextTabId = 0, tabs = [], currentTabId = null;
let activeEl = null, activeImg = null, mutObs = null;

const preview    = document.getElementById('preview');
const emptyState = document.getElementById('empty-state');
const fbar       = document.getElementById('fbar');
const fileNameEl = document.getElementById('file-name');
const unsavedEl  = document.getElementById('unsaved');
const tabBar     = document.getElementById('tab-bar');
const tabCnt     = document.getElementById('tab-container');

function getTab() { return tabs.find(t => t.id === currentTabId); }

function saveCurrentTabState() {
  const t = getTab(); if (!t) return;
  t.styleTags = '';
  preview.querySelectorAll('style').forEach(s => { t.styleTags += s.outerHTML + '\n'; });
  const c = preview.cloneNode(true);
  c.querySelectorAll('style').forEach(s => s.remove());
  c.querySelectorAll('[contenteditable]').forEach(el => { el.removeAttribute('contenteditable'); el.classList.remove('ed-active'); });
  t.previewBody = c.innerHTML;
  t.unsaved = unsavedEl.classList.contains('show');
}

function switchTab(tabId) {
  if (currentTabId === tabId) return;
  closeActive(); if (mutObs) mutObs.disconnect();
  saveCurrentTabState(); currentTabId = tabId;
  const t = tabs.find(x => x.id === tabId);
  if (t) {
    if (t.previewBody || t.styleTags) {
      preview.innerHTML = (t.styleTags || '') + (t.previewBody || '');
      emptyState.style.display = 'none'; preview.style.display = 'block';
    } else {
      preview.innerHTML = ''; preview.style.display = 'none';
      emptyState.style.display = 'flex';
    }
    fileNameEl.textContent = t.name || 'untitled.html';
    document.getElementById('btn-save').disabled = false;
    unsavedEl.classList.toggle('show', !!t.unsaved);
    mutObs = new MutationObserver(() => setUnsaved(true));
    mutObs.observe(preview, { childList: true, subtree: true, characterData: true, attributes: true });
  }
  renderTabs();
}

function closeTab(tabId) {
  const t = tabs.find(x => x.id === tabId);
  if (!t) return;
  if (t.unsaved && !confirm(`「${t.name}」有未保存更改，确定关闭？`)) return;
  const idx = tabs.indexOf(t); tabs.splice(idx, 1);
  if (currentTabId === tabId) {
    closeActive(); if (mutObs) { mutObs.disconnect(); mutObs = null; }
    if (tabs.length > 0) switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
    else { currentTabId = null; preview.style.display = 'none'; preview.innerHTML = '';
      emptyState.style.display = 'flex'; fileNameEl.textContent = '未打开文件';
      document.getElementById('btn-save').disabled = true; unsavedEl.classList.remove('show'); }
  }
  renderTabs();
}

function renderTabs() {
  tabCnt.innerHTML = '';
  tabs.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tab' + (t.id === currentTabId ? ' active' : '');
    d.innerHTML = `<span class="tab-dot${t.unsaved?' show':''}"></span><span class="tab-name">${esc(t.name||'untitled')}</span><span class="tab-close">✕</span>`;
    d.addEventListener('click', e => { if (!e.target.classList.contains('tab-close')) switchTab(t.id); });
    d.querySelector('.tab-close').addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
    tabCnt.appendChild(d);
  });
  tabBar.classList.toggle('show', tabs.length > 0);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function createTab(name, styleTags, bodyHTML) {
  const tab = { id: ++nextTabId, name, styleTags: styleTags||'', previewBody: bodyHTML||'', unsaved: false };
  tabs.push(tab); switchTab(tab.id);
}
function createBlankTab() {
  const tab = { id: ++nextTabId, name: '空白页', styleTags: '', previewBody: '', unsaved: false };
  tabs.push(tab);
  switchTab(tab.id);
  preview.style.display = 'none';
  emptyState.style.display = 'flex';
  preview.innerHTML = '';
  fileNameEl.textContent = '空白页';
  document.getElementById('btn-save').disabled = false;
  unsavedEl.classList.remove('show');
  renderTabs();
}

// ── 文件操作 ──
async function openFile() {
  document.getElementById('file-in').click();
}

document.getElementById('file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) loadHTML(f); e.target.value = '';
});

async function loadHTML(file) {
  const txt = await file.text();
  const doc = new DOMParser().parseFromString(txt, 'text/html');
  let s = '';
  doc.querySelectorAll('style').forEach(el => { s += el.outerHTML + '\n'; });
  createTab(file.name, s, doc.body.innerHTML);
}

async function saveFile() {
  const html = buildHTML();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  a.download = getTab()?.name || 'edited.html';
  a.click(); URL.revokeObjectURL(a.href);
  setUnsaved(false); toast('✅ 已下载');
}

function buildHTML() {
  const c = preview.cloneNode(true);
  c.querySelectorAll('[contenteditable]').forEach(el => { el.removeAttribute('contenteditable'); el.classList.remove('ed-active'); });
  const styles = [];
  c.querySelectorAll('style').forEach(s => { styles.push(s.outerHTML); s.remove(); });
  return `<!DOCTYPE html>\n<html lang="zh">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${styles.join('\n')}\n</head>\n<body>\n${c.innerHTML}\n</body>\n</html>`;
}

function setUnsaved(v) {
  const t = getTab(); if (t) t.unsaved = v;
  unsavedEl.classList.toggle('show', v);
  renderTabs();
}

// ── 选中元素 ──
preview.addEventListener('mousedown', e => {
  if (e.target === preview) { closeActive(); return; }
  selectEl(e.target);
});
preview.addEventListener('dblclick', e => {
  const el = e.target;
  if (el === preview || el.tagName === 'IMG') return;
  makeEditable(el);
  const range = document.createRange(); range.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
});

function selectEl(el) {
  if (activeEl && activeEl !== el) deactivateEl(activeEl);
  activeEl = el; activeImg = el.tagName === 'IMG' ? el : null;
  if (el.tagName !== 'IMG') makeEditable(el);
  const sz = Math.round(parseFloat(getComputedStyle(el).fontSize));
  document.getElementById('fb-sz').value = sz;
  document.getElementById('fb-repl-img').style.display = activeImg ? 'inline-block' : 'none';
  showFbar(el);
}
function makeEditable(el) { el.contentEditable = 'true'; el.classList.add('ed-active'); }
function deactivateEl(el) { if (!el) return; el.contentEditable = 'false'; el.classList.remove('ed-active'); }
function closeActive() {
  deactivateEl(activeEl); activeEl = null; activeImg = null;
  hideFbar();
}
document.addEventListener('mousedown', e => {
  if (!preview.contains(e.target) && !fbar.contains(e.target)) closeActive();
});

// ── 浮动工具条 ──
function showFbar(el) {
  fbar.classList.add('show');
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect();
    let top = r.top - fbar.offsetHeight - 10; if (top < 6) top = r.bottom + 10;
    let left = r.left; const bw = fbar.offsetWidth;
    if (left + bw > window.innerWidth - 8) left = window.innerWidth - bw - 8;
    left = Math.max(8, left); fbar.style.top = top + 'px'; fbar.style.left = left + 'px';
  });
}
function hideFbar() { fbar.classList.remove('show'); }

// ── 字号 ──
function applySize(px) {
  if (!px || px < 1) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && preview.contains(sel.anchorNode)) {
    document.execCommand('fontSize', false, '7');
    preview.querySelectorAll('font[size="7"]').forEach(f => {
      const span = document.createElement('span'); span.style.fontSize = px + 'px';
      while (f.firstChild) span.appendChild(f.firstChild); f.replaceWith(span);
    });
  } else if (activeEl && activeEl !== preview) { activeEl.style.fontSize = px + 'px'; }
}

// ── 新增文字行 ──
function addTextRow(after) {
  const p = document.createElement('p');
  p.style.cssText = 'margin:8px 0;padding:2px 0;min-height:1.5em;';
  p.textContent = '双击编辑文字';
  if (after && after !== preview && after.parentNode) after.parentNode.insertBefore(p, after.nextSibling);
  else preview.appendChild(p);
  deactivateEl(activeEl); activeEl = p; activeImg = null; makeEditable(p); p.focus();
  requestAnimationFrame(() => {
    const range = document.createRange(); range.selectNodeContents(p);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); showFbar(p);
  });
}

// ── 新增图片行（base64 data URI） ──
let pendingImgTarget = null;

function addImageRow(after) {
  pendingImgTarget = after;
  document.getElementById('img-in').click();
}

document.getElementById('img-in').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;

  const reader = new FileReader();
  reader.onload = ev => {
    if (activeImg) {
      // 替换现有图片
      activeImg.src = ev.target.result; toast('✅ 图片已替换');
      return;
    }
    // 新增图片行
    const img = document.createElement('img');
    img.src = ev.target.result;
    img.style.cssText = 'max-width:100%;display:block;margin:8px 0;';
    const target = pendingImgTarget;
    if (target && target !== preview && target.parentNode) {
      target.parentNode.insertBefore(img, target.nextSibling);
    } else {
      preview.appendChild(img);
    }
    pendingImgTarget = null;
    deactivateEl(activeEl); activeEl = img; activeImg = img;
    hideFbar();
    document.getElementById('fb-repl-img').style.display = 'inline-block';
    showFbar(img);
    toast('✅ 图片已插入');
  };
  reader.readAsDataURL(f);
});

// ── 替换图片 ──
function startReplaceImg() {
  if (!activeImg) return;
  document.getElementById('img-in').click();
}

// ── 删除 ──
function deleteEl() {
  if (!activeEl || activeEl === preview) return;
  if (!confirm('确定删除此元素？')) return;
  activeEl.remove(); activeEl = null; activeImg = null; hideFbar();
}

// ── 工具栏按钮 ──
document.getElementById('btn-open').addEventListener('click', openFile);
document.getElementById('btn-save').addEventListener('click', saveFile);
document.getElementById('btn-new-tab').addEventListener('click', createBlankTab);

// ── 浮动工具条按钮 ──
document.getElementById('fb-apply').addEventListener('click', () => applySize(parseInt(document.getElementById('fb-sz').value)));
document.getElementById('fb-aplus').addEventListener('click', () => { const sz = Math.min(200, parseInt(document.getElementById('fb-sz').value || 16) + 2); document.getElementById('fb-sz').value = sz; applySize(sz); });
document.getElementById('fb-aminus').addEventListener('click', () => { const sz = Math.max(6, parseInt(document.getElementById('fb-sz').value || 16) - 2); document.getElementById('fb-sz').value = sz; applySize(sz); });
document.getElementById('fb-add-text').addEventListener('click', () => addTextRow(activeEl));
document.getElementById('fb-add-img').addEventListener('click', () => addImageRow(activeEl));
document.getElementById('fb-repl-img').addEventListener('click', startReplaceImg);
document.getElementById('fb-del').addEventListener('click', deleteEl);

// ── 快捷键 ──
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (!document.getElementById('btn-save').disabled) saveFile(); }
  if (e.key === 'Escape') closeActive();
});

// ── 拖放 ──
const dropMask = document.getElementById('drop-mask'); let dragD = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); dragD++; if ([...e.dataTransfer.items].some(i => i.type === 'text/html' || i.type === '')) dropMask.classList.add('show'); });
document.addEventListener('dragleave', () => { if (--dragD <= 0) { dragD=0; dropMask.classList.remove('show'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragD=0; dropMask.classList.remove('show'); const f = e.dataTransfer.files[0]; if (f && /\.html?$/i.test(f.name)) loadHTML(f); });

// ── Toast ──
function toast(msg, ms=2200) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms);
}
</script>
</body>
</html>
